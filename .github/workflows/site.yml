# Verifica o código a cada pull request e a cada push na main: lint, tipos,
# testes, formatação e build. A publicação fica com a Vercel: produção a partir
# da main e uma prévia para cada push nos outros ramos.
name: Verificação

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Um push novo cancela a verificação anterior do mesmo ramo.
concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint, tipos, testes e formatação
        run: npm run check

      - name: Build do site estático
        run: npm run build
